<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>greenroutine</title>
<style>
:root{--bg:#eef3ee;--fg:#10261f;--pn:#fff;--mu:#5a6e64;--ac:#1f7a4d;--bl:#2d6fb7;--sun:#d98e04;--ln:#d3dfd5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b16;--fg:#e4efe8;--pn:#172820;--mu:#9bb3a6;--ac:#52c98a;--bl:#6aa8ee;--sun:#f0b43a;--ln:#274034}}
:root[data-theme="dark"]{--bg:#0e1b16;--fg:#e4efe8;--pn:#172820;--mu:#9bb3a6;--ac:#52c98a;--bl:#6aa8ee;--sun:#f0b43a;--ln:#274034}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 18px 96px}
h1{font-size:26px;line-height:1.25;margin:0 0 4px;letter-spacing:-.02em}
h2{font-size:18px;margin:26px 0 8px}
p{margin:6px 0}.mu{color:var(--mu);font-size:13px}
.hero{padding:6px 0 14px;border-bottom:2px solid var(--fg)}
.big{font-size:44px;font-weight:800;letter-spacing:-.03em;color:var(--ac);line-height:1.1}
.q{padding:14px 0;border-bottom:1px solid var(--ln)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
button{font:inherit;cursor:pointer;border:1.5px solid var(--ln);background:var(--pn);color:var(--fg);border-radius:10px;padding:9px 14px;min-height:40px}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
button.ghost{border-style:dashed;color:var(--mu)}
button:disabled{opacity:.45;cursor:default}
.act{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--ln)}
.act b{display:block}
.tag{font-size:12px;color:var(--mu)}
.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.row span:first-child{width:74px;flex:none}
.trk{flex:1;height:10px;background:var(--ln);border-radius:5px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:5px}
.box{background:var(--pn);border-radius:14px;padding:14px 16px;margin:10px 0}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--ac);flex:none;display:grid;place-items:center;font-size:16px;color:#fff;padding:0;min-height:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--pn);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;border-radius:8px;font-size:13px;padding:8px 2px;color:var(--mu)}
nav button.on{background:none;color:var(--ac);font-weight:800}
a{color:var(--bl)}
summary{cursor:pointer;min-height:28px}
details.q p{margin:6px 0 2px}
.lk{display:block;background:var(--pn);border-radius:12px;padding:12px 14px;margin:8px 0;text-decoration:none;color:var(--fg)}
.lk span{display:block;font-size:12px;color:var(--mu)}
.cal{background:var(--pn);border-radius:14px;padding:10px 10px 12px;margin:14px 0 4px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ch button{min-height:36px;padding:4px 14px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cg .wd{font-size:12px;color:var(--mu);padding:2px 0}
.cg button{min-height:42px;padding:2px 0;border-radius:10px;border:1.5px solid transparent;background:none;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.1}
.cg button.td{border-color:var(--ac)}
.cg button.sel{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.cg button:disabled{opacity:.3}
.cg i{width:5px;height:5px;border-radius:50%;background:var(--ac)}
.cg i.no{opacity:0}
.cg button.sel i{background:#fff}
.intro{border:1.5px solid var(--ln);margin:14px 0 0}
.intro ul{list-style:none;margin:8px 0 0;padding:0}
.intro li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--ln);font-size:14px}
.intro li b{flex:none;width:36px;color:var(--ac)}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const Q=[
{k:"mob",q:"주로 어떻게 등교하나요?",n:"편도 15km, 주 5일 왕복 기준으로 계산해요.",o:[["승용차",19.92],["버스·지하철",4.66],["도보·자전거",0]]},
{k:"del",q:"배달·포장 음식은 일주일에 몇 번?",o:[["0~1회",.995],["2~4회",2.985],["5회 이상",4.975]]},
{k:"cup",q:"일회용컵은 일주일에 몇 번?",o:[["0~2회",.048],["3~6회",.192],["7회 이상",.336]]},
{k:"pwr",q:"쓰지 않는 플러그·충전기는 어떻게 하나요?",o:[["항상 뽑아요",0],["가끔 뽑아요",.06],["거의 안 뽑아요",.119]]},
{k:"food",q:"식사 후 잔반(남기는 음식)은 어느 정도인가요?",o:[["거의 안 남겨요 (주 100g 이하)",.0192],["가끔 남겨요 (주 500g 정도)",.096],["자주 남겨요 (주 1kg 이상)",.192]]}];
const CN={mob:"이동",del:"배달·포장",cup:"일회용컵",pwr:"전기",food:"잔반",meat:"식단",etc:"종이·비닐"};
const A=[
["b1","mob","승용차 대신 대중교통 이용하기",1.6757,2,"1회"],
["b2","meat","채식·저육류 식사 한 끼",1,2,"1회"],
["b3","food","잔반 남기지 않기",.0192,1,"100g"],
["b4","del","배달 시 다회용기 사용·일회용 수저 거절",.85,1,"1회"],
["b6","cup","텀블러·다회용컵 사용하기",.25,1,"1회"],
["b7","cup","일회용컵 없는 하루 보내기",.096,2,"컵 2개"],
["b8","del","포장 대신 학식·매장 식사",.2,1,"1회"],
["b9","pwr","사용하지 않는 플러그 뽑기",.2329,1,"1회"],
["b10","etc","종이 영수증 대신 전자영수증 받기",.00059,1,"1건"],
["b11","etc","종이 대신 전자자료 사용하기",.0097,1,"1장"],
["b12","etc","장바구니 사용하고 일회용 비닐봉투 거절하기",.068,1,"1개"]];
const CS={b1:1500,b2:1000,b3:200,b4:0,b6:300,b7:600,b8:3000,b9:3};
const LV=["","쉬움","보통","도전"];
const NOTE="감축량은 연구 자료를 바탕으로 한 잠정 추정치예요. 실제 감축량은 개인의 실천 방식, 사용 제품, 이동거리 등에 따라 달라질 수 있어요.";
let S={ans:{},mine:[],log:{}},tab=0,sw=null,rt=1,sd=null,cv=null;
try{S=Object.assign(S,JSON.parse(localStorage.getItem("gr")||"{}"))}catch(e){}
const K=id=>A.find(a=>a[0]==id);
const fix=()=>{S.mine=(S.mine||[]).filter(K);for(const k in S.log)S.log[k]=S.log[k].filter(K);if(S.goal){S.goal.ids=S.goal.ids.filter(K);if(!S.goal.ids.length)S.goal=null}if(S.dr)S.dr.ids=S.dr.ids.filter(K)};
fix();
let DOC=null,tmr=null,ST="",LAST=JSON.stringify(Object.assign({},S,{t:0}));
const stat=t=>{ST=t;const e=document.getElementById("st");if(e)e.textContent=t};
const save=()=>{const c=JSON.stringify(Object.assign({},S,{t:0})),ch=c!=LAST;if(ch){LAST=c;S.t=Date.now()}
try{localStorage.setItem("gr",JSON.stringify(S))}catch(e){}
if(ch&&DOC){clearTimeout(tmr);tmr=setTimeout(()=>DOC.set({s:JSON.stringify(S)}).then(()=>stat("계정에 저장됨")).catch(()=>stat("이 기기에만 저장됨")),600)}};
const dk=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toLocaleDateString("sv")};
const L=n=>S.log[dk(n)]||[];
const dayKg=(n,c)=>L(n).reduce((s,id)=>{const a=K(id);return a&&(!c||a[1]==c)?s+a[3]:s},0);
const wk=(w,c)=>{let s=0;for(let i=0;i<7;i++)s+=dayKg(w*7+i,c);return s};
const tot=()=>Object.keys(S.log).reduce((s,k)=>s+S.log[k].reduce((t,id)=>t+(K(id)?K(id)[3]:0),0),0);
const streak=()=>{let i=L(0).length?0:1,n=0;while(L(i+n).length)n++;return n};
const done=()=>Q.every(q=>S.ans[q.k]!=null);
const base=k=>{const q=Q.find(x=>x.k==k);return !q||S.ans[k]==null?0:q.o[S.ans[k]][1]};
const rec=()=>A.filter(a=>!(a[0]=="b1"&&S.ans.mob!=0)&&!(a[1]!="meat"&&a[1]!="etc"&&done()&&base(a[1])==0)).map(a=>[a,a[3]/a[4]*(1+base(a[1])/8)]).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);
const topK=()=>Object.keys(CN).sort((a,b)=>base(b)-base(a));
const f=x=>x==0?"0":Math.abs(x)>=10?x.toFixed(1):Math.abs(x)>=1?x.toFixed(2):Math.abs(x)>=.01?x.toFixed(3):x.toFixed(4);
const CS0=a=>CS[a[0]]||0;
const catTot=k=>Object.keys(S.log).reduce((s,d)=>s+S.log[d].reduce((t,id)=>{const a=K(id);return a&&a[1]==k?t+a[3]:t},0),0);
const dl=n=>{const d=new Date();d.setDate(d.getDate()-n);return `${d.getMonth()+1}/${d.getDate()}(${"일월화수목금토"[d.getDay()]})`};
const off=k=>Math.round((new Date(dk(0))-new Date(k))/864e5);
const sm=(lo,hi,ids)=>{let s=0,c=0,m=0;for(let n=Math.max(lo,0);n<=hi;n++)L(n).forEach(id=>{const a=K(id);if(a&&(!ids||ids.includes(id))){s+=a[3];c+=CS[id]||0;m++}});return[s,c,m]};
const won=x=>Math.round(x).toLocaleString("ko-KR")+"원";
const hv=k=>base(k)/Math.max(...Q.find(q=>q.k==k).o.map(o=>o[1]))>=.45;
const plan=()=>S.goal?S.goal.ids.map(id=>[K(id),S.goal.fq]):Object.keys(CN).map(k=>rec().find(a=>a[1]==k)).filter(Boolean).map(a=>[a,5]);
const after=k=>{const x=plan().filter(p=>p[0][1]==k).reduce((s,p)=>s+p[0][3]*p[1],0);return Math.max(base(k)*.2,base(k)-x)};

function v0(){return `<div class="hero"><h1>내 습관부터 확인해요</h1><p class="mu">다섯 가지 질문에 답하면 배출이 큰 습관을 찾아 드려요.</p></div><div class="box intro"><b>🌱 greenroutine은 이런 앱이에요</b><p>대학생이 일상 속 작은 실천으로 탄소 배출을 줄이도록 돕는 앱이에요. 내 생활습관의 배출량을 확인하고, 실천할 행동을 정해 기록하면서 줄인 탄소량을 눈으로 확인할 수 있어요.</p><ul><li><b>진단</b><span>다섯 가지 질문에 답하면 내 주간 배출량과 배출이 큰 습관을 알려줘요.</span></li><li><b>추천</b><span>진단 결과에 맞는 행동을 보고, 해 볼 행동을 '담기'해요.</span></li><li><b>오늘</b><span>담은 행동을 실천하면 체크해요. 오늘 줄인 탄소량과 연속 실천일이 쌓이고, 달력에서 지난 기록을 확인하고 수정할 수 있어요.</span></li><li><b>목표</b><span>기간과 횟수, 행동을 골라 목표를 세우고 진행 상황을 확인해요.</span></li><li><b>리포트</b><span>일·주·누적 단위로 줄인 탄소량의 변화를 그래프로 봐요.</span></li><li><b>혜택</b><span>탄소중립포인트제처럼 실천하면 받을 수 있는 혜택과 신청 방법을 안내해요.</span></li></ul><p class="mu" style="margin-top:8px">먼저 아래 질문 5개에 답하는 것부터 시작해 보세요.</p></div><a class="lk" href="https://forms.gle/Z5URpSbb5SMT1q9Q6" target="_blank" rel="noopener" style="border:1.5px solid var(--ac);margin:14px 0 0"><b>🌱 5일 정도 사용해 보신 뒤 이용 후기를 남겨 주세요!</b><span style="font-size:13px;margin-top:2px">사용하면서 느낀 점과 불편했던 점을 알려 주시면 큰 도움이 돼요. 후기 남기러 가기 →</span></a>`+
Q.map(q=>`<div class="q"><b>${q.q}</b>${q.n?`<p class="mu" style="margin:2px 0 0">${q.n}</p>`:""}<div class="opts">${q.o.map((o,i)=>`<button class="${S.ans[q.k]===i?"on":""}" onclick="setA('${q.k}',${i})">${o[0]}</button>`).join("")}</div></div>`).join("")+
(done()?res()+`<p style="margin-top:14px"><button class="on" onclick="go(1)">맞춤 행동 추천 보기</button></p>`:`<p class="mu" style="margin-top:14px">모든 질문에 답하면 결과가 나와요.</p>`)}

const basis=()=>`<details class="q"><summary><b>감축량 계산 기준 보기</b></summary><p class="mu">연구 자료를 바탕으로 정한 잠정 추정치예요.</p>`+A.map(a=>`<div class="row"><span style="width:auto;flex:1">${a[2]}</span><span style="width:auto">${a[5]}당 ${f(a[3])}kg</span></div>`).join("")+`<p class="mu">습관 진단은 등교 편도 15km·주 5일 왕복, 배달 주 1·3·5회(일회용기 1회 약 1kg), 일회용컵 주 1·4·7개, 잔반 주 100g·500g·1kg을 기준으로 계산했어요. 도보·자전거 이동의 배출량은 0으로 가정했어요. 플러그 뽑기는 보급 가구당 0.085tCO2eq(85kg)를 하루 1회 기준(85kg÷365일)으로 나눈 값이에요. 대중교통은 1인 1회 1.6757kg, 다회용컵은 1회 0.25kg, 일회용컵은 1개 0.048kg, 잔반은 퇴비화 기준 1kg당 0.192kg, 전자영수증은 1건 0.00059kg, 전자자료는 종이 1장 0.0097kg, 장바구니는 비닐봉투 1개 0.068kg이에요. 한 정거장 먼저 내려 걷기는 자료가 정리되기 전까지 제외했어요.</p></details>`;

function tips(){const c=[];
if(hv("cup")||hv("del"))c.push(["플라스틱·일회용품 사용이 많은 편이에요","텀블러나 다회용컵을 쓰고, 배달은 다회용기로 주문하며 일회용 수저는 거절하고, 가능하면 학식을 이용해 보세요.","혜택: 텀블러나 다회용컵을 가져오면 할인해 주는 매장이 있어요(매장마다 달라요). 탄소중립포인트 녹색생활 실천에는 다회용기 배달 이용, 리필스테이션 이용 등이 있어요. 항목별 인센티브는 누리집에서 확인하세요.",["b6","b4","b8"]]);
if(hv("pwr"))c.push(["전기 사용 습관을 줄일 여지가 있어요","사용하지 않는 충전기와 플러그를 뽑는 습관을 들여 보세요.","참여 가능한 제도: 탄소중립포인트 에너지는 전기·수도·도시가스를 줄인 비율에 따라 포인트를 주고 연 최대 10만 원까지 받을 수 있어요. 신청 대상과 명의 조건은 누리집이나 구청에서 확인하세요.",["b9"]]);
if(hv("mob"))c.push(["승용차 이동 비중이 커요","승용차 대신 버스·지하철로 등교해 보세요. 배출량이 크게 줄어요.","참여 가능한 제도: 차량 소유자라면 탄소중립포인트 자동차(주행거리 감축률에 따라 연 2만~10만 포인트)를 확인하세요.",["b1"]]);
if(hv("food"))c.push(["잔반이 많은 편이에요","먹을 만큼만 담아 잔반을 줄이고, 가끔은 채식·저육류 식사로 바꿔 보세요.","",["b3","b2"]]);
if(!c.length){const ids=rec().slice(0,3).map(a=>a[0]);c.push(["현재 습관에 맞는 맞춤 행동이에요","추천 순서가 높은 행동부터 목표를 세워 실천해 보세요.","",ids])}
return c.length?`<h2>결과에 따른 맞춤 행동</h2>`+c.map(x=>`<div class="box"><b>${x[0]}</b><p>${x[1]}</p>${x[2]?`<p class="mu">${x[2]}</p>`:""}<button class="on" onclick="pick('${x[3].join(",")}')">이 행동으로 목표 세우기</button></div>`).join(""):""}

function res(){const O=Q.map(q=>q.k).sort((a,b)=>base(b)-base(a)),T=O.reduce((s,k)=>s+base(k),0),T2=O.reduce((s,k)=>s+after(k),0),mx=Math.max(...O.map(base),.001),pc=x=>T?(x/T*100<1&&x>0?(x/T*100).toFixed(1):Math.round(x/T*100)):0,w=x=>x>0?Math.max(1.5,x/mx*100):0;
return `<h2>내 예상 탄소 배출량</h2><div class="big" style="color:var(--sun)">${f(T)}<small style="font-size:18px"> kg/주</small></div><p class="mu">입력한 생활습관 기준 예상치예요. 연으로 환산하면 약 ${Math.round(T*52)}kg이에요.</p>`+

const cm=(t,p,c,u)=>{const m=Math.max(p,c,.001);return `<div style="margin:10px 0"><b style="font-size:13px">${t}</b><div class="row"><span>이전</span><div class="trk"><i style="width:${p/m*100}%;background:var(--bl);opacity:.55"></i></div><span style="width:70px;text-align:right">${u(p)}</span></div><div class="row"><span>목표 기간</span><div class="trk"><i style="width:${c/m*100}%;background:var(--ac)"></i></div><span style="width:70px;text-align:right">${u(c)}</span></div></div>`};
function gprog(g){const s=off(g.start),fin=s>=g.n-1,lo=s-g.n+1,w=g.fq*g.n/7,kg=x=>f(x)+"kg";
const sec=id=>{const a=K(id),cur=sm(lo,s,[id]),prv=sm(s+1,s+g.n,[id]),d=cur[0]-prv[0],days=[];
for(let n=s;n>=Math.max(lo,0);n--)if(L(n).includes(id))days.push(dl(n));
return `<h2>${a[2]}</h2><p class="mu">${CN[a[1]]} · ${a[5]}당 ${f(a[3])}kg 감축</p>`+
pr("실천 횟수",cur[2],Math.round(w),x=>x+"회")+pr("탄소 감축",cur[0],a[3]*w,kg)+
`<b style="font-size:13px">실천한 날 (${days.length}일)</b><div class="opts" style="margin-top:6px">${days.length?days.map(x=>`<span class="tag" style="border:1px solid var(--ln);border-radius:8px;padding:3px 8px;background:var(--pn)">${x}</span>`).join(""):`<span class="mu">아직 실천한 날이 없어요.</span>`}</div><p class="mu">${prv[0]>0?`이전 ${g.n}일보다 ${f(Math.abs(d))}kg ${d>=0?"더 줄였어요":"덜 줄였어요"}.`:"이전 기록이 없어서 이번 기간이 기준이 돼요."}</p>`};
const cur=sm(lo,s,g.ids),prv=sm(s+1,s+g.n,g.ids),ex=g.ids.reduce((t,id)=>t+K(id)[3],0),d=cur[0]-prv[0];
return `<div class="hero"><p class="mu">${fin?"목표 기간이 끝났어요":`목표 진행 중 · ${s+1}/${g.n}일차`}</p><h1>실천 목표</h1><p class="mu">행동 ${g.ids.length}개 · 주 ${g.fq}회 · ${g.n}일</p></div>`+
g.ids.map(sec).join("")+
`<h2>전체 합계</h2>`+pr("실천 횟수",cur[2],Math.round(g.ids.length*w),x=>x+"회")+pr("탄소 감축",cur[0],ex*w,kg)+
`<h2>이전 ${g.n}일과 비교</h2>`+cm("탄소 감축",prv[0],cur[0],kg)+
`<p>${prv[0]>0?`이전보다 탄소를 ${f(Math.abs(d))}kg ${d>=0?"더 줄였어요":"덜 줄였어요"}.`:"이전 기록이 없어서 이번 기간이 기준이 돼요."}</p><p class="mu">같은 행동만 비교했어요. ${NOTE}</p><div class="opts"><button class="ghost" onclick="gEnd()">목표 종료하고 새로 세우기</button></div>`}
function v5(){const g=S.goal,d=S.dr||(S.dr={ids:[],n:7,fq:5});
if(!done())return `<div class="hero"><h1>실천 목표</h1></div><p>먼저 습관 진단을 완료하면 맞춤 목표를 세울 수 있어요.</p><button class="on" onclick="go(0)">진단하러 가기</button>`;
if(g)return gprog(g);
const e=d.ids.reduce((t,id)=>[t[0]+K(id)[3],t[1]+(CS[id]||0)],[0,0]),w=d.fq*d.n/7;
return `<div class="hero"><h1>실천 목표 세우기</h1><p class="mu">기간과 횟수, 행동을 고르면 예상 효과를 바로 보여드려요.</p></div>`+
`<h2>1. 기간</h2><div class="opts">${[7,14].map(n=>`<button class="${d.n==n?"on":""}" onclick="dSet('n',${n})">${n}일</button>`).join("")}</div>`+
`<h2>2. 주당 실천 횟수</h2><div class="opts">${[3,5,7].map(n=>`<button class="${d.fq==n?"on":""}" onclick="dSet('fq',${n})">주 ${n}회</button>`).join("")}</div>`+
`<h2>3. 실천할 행동</h2>`+rec().map(a=>`<div class="act"><div><b>${a[2]}</b><span class="tag">${CN[a[1]]} · ${a[5]}당 ${f(a[3])}kg 감축 · ${LV[a[4]]}</span></div><button class="${d.ids.includes(a[0])?"on":""}" onclick="dTg('${a[0]}')">${d.ids.includes(a[0])?"선택됨":"선택"}</button></div>`).join("")+
`<div class="box"><b>예상 효과 (${d.n}일)</b><p>탄소 <b>${f(e[0]*w)}kg</b> 감축</p><p class="mu">선택한 행동을 주 ${d.fq}회씩 ${d.n}일 동안 했을 때의 예상치예요. ${NOTE}</p></div><button class="on" ${d.ids.length?"":"disabled"} onclick="gStart()">목표 시작</button>`}

const V=[v0,v1,v2,v5,v3,v4],NV=["진단","추천","오늘","목표","리포트","혜택"];
function r(){document.getElementById("app").innerHTML=V[tab]()+`<p class="mu" id="st">${ST}</p>`;document.getElementById("nav").innerHTML=NV.map((n,i)=>`<button class="${i==tab?"on":""}" onclick="go(${i})">${n}</button>`).join("");save()}
function go(i){tab=i;r();scrollTo(0,0)}
function setA(k,i){S.ans[k]=i;r()}
function tgM(id){S.mine=S.mine.includes(id)?S.mine.filter(x=>x!=id):S.mine.concat(id);r()}
function tgS(id){sw=sw==id?null:id;r()}
function swap(o,n){S.mine=S.mine.map(x=>x==o?n:x);S.log[dk(0)]=L(0).filter(x=>x!=o);sw=null;r()}
function ck(id){const k=SD(),l=LD(k);S.log[k]=l.includes(id)?l.filter(x=>x!=id):l.concat(id);r()}
function demo(){if(!S.mine.length)S.mine=rec().slice(0,4).map(a=>a[0]);for(let i=1;i<=27;i++){const p=.3+.5*(1-i/27),ids=S.mine.filter(()=>Math.random()<p);if(ids.length)S.log[dk(i)]=ids}r()}
r();
(async()=>{try{if(typeof claude=="undefined")return stat("이 기기에만 저장됨");
const u=await claude.use("user"),d=await claude.use("db"),id=u&&await u.id();
if(!d||!id)return stat("이 기기에만 저장됨 (claude.ai에 로그인하면 계정에 저장돼요)");
DOC=d.collection("data/users/"+id).doc("state");
const s=await DOC.get(),R=s.exists?JSON.parse(s.data().s):null;
if(R&&(R.t||0)>(S.t||0)){S=Object.assign({ans:{},mine:[],log:{}},R);fix();LAST=JSON.stringify(Object.assign({},S,{t:0}));r()}
else if(Object.keys(S.ans).length||S.mine.length){S.t=S.t||Date.now();await DOC.set({s:JSON.stringify(S)})}
stat("계정에 저장됨")}catch(e){stat("이 기기에만 저장됨")}})();
</script></body></html>
